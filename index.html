<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1930 Czechoslovak Census</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>1930 Czechoslovak Census</h1>
  </header>

  <main>
    <form id="search">
      <label>First name <input name="name" autocomplete="off" placeholder="e.g. Anna"></label>
      <label>Surname <input name="surname" autocomplete="off" placeholder="e.g. Kafka"></label>
      <label>District <select name="district"><option value="">Any district</option></select></label>
      <label>Municipality <select name="municipality"><option value="">Any municipality</option></select></label>
      <button type="submit">Search</button>
    </form>

    <p id="status">Loading index…</p>

    <div class="scroll">
      <table id="results" hidden>
        <thead>
          <tr>
            <th>First name</th>
            <th>Surname</th>
            <th>Municipality</th>
            <th>District</th>
            <th>Sheet</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <nav id="pager" class="pager" aria-label="Pagination" hidden>
      <button type="button" id="prev">← Previous</button>
      <span id="page-label"></span>
      <button type="button" id="next">Next →</button>
    </nav>
  </main>

  <script src="app.js"></script>
</body>
</html>

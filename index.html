<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1930 Czechoslovak Census</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>1930 Czechoslovak Census</h1>
  </header>

  <main>
    <form id="search">
      <label>First name <input name="name" autocomplete="off" placeholder="e.g. Anna"></label>
      <label>Surname <input name="surname" autocomplete="off" placeholder="e.g. Kafka"></label>
      <label>District <input name="district" list="districts" autocomplete="off" placeholder="okres"></label>
      <label>Municipality <input name="municipality" list="municipalities" autocomplete="off" placeholder="obec"></label>
      <datalist id="districts"></datalist>
      <datalist id="municipalities"></datalist>
      <button type="submit">Search</button>
    </form>

    <p id="status">Loading index…</p>

    <div class="scroll">
      <table id="results" hidden>
        <thead>
          <tr>
            <th>First name</th>
            <th>Surname</th>
            <th>Municipality</th>
            <th>District</th>
            <th>Sheet</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
